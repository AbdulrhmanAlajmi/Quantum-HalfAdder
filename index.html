<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مين أفضل سيارة؟ | Who's the Best Car?</title>
  <meta name="description" content="مقارنة سهلة وممتعة بين خمس سيارات — اضغط زرًا واحدًا واعرف مَن الأفضل! A fun one-tap comparison of five cars." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>👑</text></svg>" />
</head>
<body>

  <!-- Ambient chrome particles -->
  <canvas id="particles" aria-hidden="true"></canvas>

  <!-- Loading screen -->
  <div id="loader" aria-hidden="true">
    <div class="loader-inner">
      <div class="loader-ring"></div>
      <div class="loader-text" data-i18n="loading">لحظة… نجهّز السيارات 🚗</div>
    </div>
  </div>

  <!-- Top bar -->
  <header class="topbar">
    <div class="brand" data-i18n="brand">🚗 مين الأفضل؟</div>
    <div class="topbar-actions">
      <button id="sound-btn" class="chip-btn" aria-label="Sound on/off">🔊</button>
      <button id="lang-btn" class="chip-btn" data-i18n="langButton">English</button>
    </div>
  </header>

  <!-- One compact screen -->
  <main class="kid-main">
    <div class="hero-star" aria-hidden="true">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="46" fill="none" stroke="#cfd4dc" stroke-width="1.6"/>
        <path fill="none" stroke="#cfd4dc" stroke-width="1.6" stroke-linejoin="round"
              d="M50 4 L54 44 L89.8 73 L55 52.5 L50 96 L45 52.5 L10.2 73 L46 44 Z"/>
      </svg>
    </div>

    <h1 class="gold-text" data-i18n="heroTitle">مين أفضل سيارة؟</h1>

    <div id="intro" class="intro">
      <p class="hero-sub" data-i18n="heroSubtitle">خمس سيارات… وواحدة فقط تفوز!</p>
      <button id="compare-btn" class="compare-btn" data-i18n="compareBtn">🏁 ابدأ المقارنة!</button>
    </div>

    <div id="champion-block" class="champion-block">
      <h2 class="gold-text" data-i18n="championTitle">مرسيدس هي الأفضل! 👑</h2>
      <p data-i18n="championSubtitle">جمعت أعلى النقاط وفازت بالتاج!</p>
      <button id="replay-btn" class="replay-btn" data-i18n="replay">🔁 العب من جديد</button>
    </div>

    <div id="fifa-grid" class="fifa-grid"></div>

    <p class="tap-hint" data-i18n="tapHint">اضغط أي سيارة لتكبيرها 👆</p>
  </main>

  <!-- Confetti overlay -->
  <canvas id="confetti" aria-hidden="true"></canvas>

  <!-- Car popup: big photo + scores -->
  <div id="modal-backdrop" class="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <button id="modal-close" class="modal-close" aria-label="Close">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/visuals.js"></script>
  <script src="js/images.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
